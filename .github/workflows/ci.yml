# Lint, typecheck and unit tests on every push and pull request.
#
# No database and no secrets: Prisma generates its client from the schema alone
# (see prisma.config.ts), and the unit tests never touch Postgres.
#
# The second job builds the Cloudflare Worker. It deploys nothing — it is here
# because the Workers build only runs on Linux, so a change that breaks it
# cannot be caught on a Windows development machine. With no database the
# prerendered pages come out empty, which is fine for a build that is thrown
# away.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `prisma generate`.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=moderate

  workers-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm cf:build
        env:
          AUTH_SECRET: ci-build-only-not-a-real-secret
          NEXT_PUBLIC_SITE_URL: https://example.invalid

      # Fails if the bundle outgrows what Workers accepts.
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbtc
          POSTGRES_PASSWORD: local-integration-only
          POSTGRES_DB: bbtc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bbtc -d bbtc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bbtc:local-integration-only@localhost:5432/bbtc_test
      AUTH_SECRET: local-integration-only-not-a-production-secret
      RAZORPAY_WEBHOOK_SECRET: local-integration-webhook
      SHIPROCKET_WEBHOOK_TOKEN: local-integration-courier
      SUPABASE_URL: http://localhost:54322
      SUPABASE_SERVICE_ROLE_KEY: isolated-storage-only
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_isolated
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: node --conditions=react-server --import tsx scripts/seed-test-fixture.ts
      - name: Install backup and browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic postgresql-client-16
          pnpm exec playwright install --with-deps chromium
      - name: Verify encrypted backup and restore
        env:
          BACKUP_DATABASE_URL: postgresql://bbtc:local-integration-only@localhost:5432/bbtc_test
          RESTORE_DATABASE_URL: postgresql://bbtc:local-integration-only@localhost:5432/bbtc_restore_test
          RESTIC_REPOSITORY: /tmp/brightblue-backup-repository
          RESTIC_PASSWORD: isolated-ci-backup-not-a-production-key
          BACKUP_STORAGE_DIR: /tmp/brightblue-test-storage
          PGPASSWORD: local-integration-only
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p "$BACKUP_STORAGE_DIR/products/fixture"
          printf 'synthetic object bytes' > "$BACKUP_STORAGE_DIR/products/fixture/image.txt"
          restic init
          node --import tsx scripts/backup.ts create > /tmp/backup-result.json
          export BACKUP_SNAPSHOT_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/backup-result.json','utf8')).snapshotId")
          createdb -h localhost -U bbtc bbtc_restore_test
          pnpm backup:verify
          restic check --read-data
      - run: node --conditions=react-server --import tsx scripts/e2e-stock-race.ts
      - name: Start isolated test server
        id: server
        run: |
          node --import tsx scripts/storage-test-server.ts > /tmp/storage-test-server.log 2>&1 &
          pnpm dev > /tmp/store-test-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            curl --fail --silent http://localhost:3000/api/health && exit 0
            sleep 2
          done
          exit 1
      - run: node --conditions=react-server --import tsx scripts/e2e-razorpay.ts
      - run: node --conditions=react-server --import tsx scripts/e2e-shiprocket.ts
      - name: Customer checkout browser journey
        run: node --conditions=react-server --import tsx scripts/e2e-customer.ts
      - name: Admin browser journeys and role enforcement
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node --conditions=react-server --import tsx scripts/e2e-admin.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-browser-screenshots
          path: qa/screenshots
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integration-server-log
          path: /tmp/store-test-server.log

  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-build-only-not-a-production-secret
      CRON_SECRET: ci-cron-only-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:next
      - name: Production HTTP smoke
        run: |
          pnpm exec next start -H 127.0.0.1 > /tmp/native-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:3000 pnpm test:http
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: native-server-log
          path: /tmp/native-server.log
